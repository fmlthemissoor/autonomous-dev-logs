# Copy this to `config.yaml` and edit. `config.yaml` is gitignored.

# Your X/Twitter handle — used in prompts so the model knows whose voice to imitate.
handle: "@your_handle"

# A short description of what you usually tweet about. Helps the model stay on-topic.
# Be opinionated here — "plainspoken, no hype, lessons over launches" beats a generic blurb.
persona: |
  Solo dev shipping a Solana analytics product. Threads mix shipping updates,
  bugs found, and small lessons. Tone is plainspoken and a bit dry. No hype,
  no feature lists, no marketing language.

# Personal feed. Pulls your own recent tweets so the writer knows what your
# followers have already seen, and adjusts depth accordingly:
#   - Topics already covered in depth → write low-key, skip the introduction.
#   - Topics new or barely touched → introduce more fully.
#
# Built explicitly via `npm run refresh-personal-feed` (saved to
# data/personal-feed.json). Daily runs only read from disk.
# Requires SOCIALDATA_API_KEY in .env.
personal_feed:
  enabled: false
  # How many of your tweets to pull on refresh.
  max_tweets: 200
  # How many of those to include in the writer prompt (most recent first).
  # Higher = more coverage signal at the cost of more tokens per run.
  max_examples_in_prompt: 60
  # Drop replies — they're conversational, not broadcast coverage.
  exclude_replies: true

# Few-shot examples of tweets in the voice you want. Used as fallback when
# voice_learning is disabled or returns nothing usable. Aim for 5-20.
# With voice_learning enabled this can stay short — the auto-fetched tweets
# from your voice_accounts do most of the work.
tweet_examples:
  - |
    Spent the morning ripping out a "clever" cache layer.
    400 lines deleted, latency the same, fewer footguns.

    Reminder: every cache is a bet that staleness is fine.
  - |
    Investigator agent kept burning steps revisiting the same 404 page.
    Added a one-line repeat-warning. Step count dropped 22%.

    Most agent perf wins are bookkeeping, not models.
  - |
    Today I learned: matplotlib axis labels render outside the canvas
    by default if your y-axis values are wide.

    `tight_layout()` exists for a reason.

# Voice learning. When enabled, fetches recent tweets from accounts whose
# style you want to imitate and feeds them to the writer as unlabeled style
# examples. No engagement scoring — pure tone/structure mimicry.
#
# Requires SOCIALDATA_API_KEY in .env. Get one at https://socialdata.tools
# (pay-as-you-go, fractions of a cent per call).
voice_learning:
  enabled: false
  # Voice sources. Each entry is one of:
  #   - a plain handle (no @ needed): paulg
  #   - an X List URL:        https://x.com/i/lists/1234567890
  #   - an X Community URL:   https://x.com/i/communities/1234567890
  # A curated 3-5 handle list usually gives sharper voice signal than a big
  # list — lists average across all members, which can blur the style.
  voice_accounts: []
  # How many tweets to pull per source (handle / list / community).
  # Lists are higher-volume so you may want to bump this for them.
  max_tweets_per_handle: 300
  # How many recent originals per source to surface in the writer prompt.
  # Bump this when reading from a list/community — 6 is fine for one writer,
  # but for a list you probably want 30-100 to actually feel the voice.
  examples_per_voice_account: 6
  # Drop tweets shorter than this many characters. Short one-liners give
  # weak voice signal — the writer learns more from tweets that show how
  # an account handles paragraphs, line breaks, and transitions.
  # 120 ≈ two-sentence tweet. Bump higher for paragraph-style accounts.
  min_tweet_chars: 120
  # Drop replies (in_reply_to_status_id is set). They usually aren't
  # representative of someone's "broadcast" voice.
  exclude_replies: true
  #
  # NOTE: the voice library is built explicitly via `npm run refresh-voice`
  # and saved to data/voice-library.json. `npm run generate` and `npm run send`
  # only READ from that file — they never call SocialData. Re-run refresh-voice
  # whenever you want fresher examples (weekly is plenty).

# Thread length controls. The writer is told that length follows substance —
# if the day's story fits in one tweet, it returns one tweet. Don't force it.
thread:
  # Minimum tweets. Default 1 = single-tweet output is allowed.
  min_tweets: 1
  # Hard ceiling on tweet count.
  max_tweets: 6
  # Per-tweet character ceiling. Default 560 ≈ two stitched tweets, gives
  # the writer room when there's substance. Padding is explicitly forbidden
  # in the prompt.
  per_tweet_char_limit: 560

# Visual planner config. Set `enabled: false` to always skip visuals.
visual:
  enabled: true
  # Which formats the planner is allowed to choose from.
  # Supported: none, chart, code_snippet, illustration
  allowed_formats:
    - none
    - chart
    - code_snippet
  # Used as the title/header of generated charts.
  chart_title_prefix: "Today in code"

# What to include from your transcripts. Sensitive content can be excluded here.
transcripts:
  # Only include sessions whose cwd matches one of these substrings.
  # Leave empty to include all projects.
  include_cwd_substrings: []
  # Always exclude sessions whose cwd matches one of these substrings.
  exclude_cwd_substrings:
    - "secrets"
  # Skip individual turns whose text or tool calls contain any of these
  # substrings. Useful when a session has the right cwd but the conversation
  # references files from another project (e.g. you asked Claude to look at
  # a file outside the project). Leave empty to disable.
  exclude_text_substrings: []
  # Drop tool results larger than this (chars). Tool calls themselves are kept.
  max_tool_result_chars: 800
