# Copy this to `config.yaml` and edit. `config.yaml` is gitignored.

# Your X/Twitter handle — used in prompts so the model knows whose voice to imitate.
handle: "@your_handle"

# A short description of what you usually tweet about. Helps the model stay on-topic.
persona: |
  Solo dev shipping a Solana analytics product. Threads mix shipping updates,
  bugs found, and small lessons. Tone is plainspoken and a bit dry. No hype.

# Few-shot examples of YOUR actual tweets. Used as a fallback / supplement
# when voice_learning is disabled or returns no usable signal. Aim for 10-20
# examples. With voice_learning enabled this list can be small or even empty
# (one entry minimum) — the auto-fetched tweets do most of the work.
tweet_examples:
  - |
    Spent the morning ripping out a "clever" cache layer.
    400 lines deleted, latency the same, fewer footguns.

    Reminder: every cache is a bet that staleness is fine.
  - |
    Investigator agent kept burning steps revisiting the same 404 page.
    Added a one-line repeat-warning. Step count dropped 22%.

    Most agent perf wins are bookkeeping, not models.
  - |
    Today I learned: matplotlib axis labels render outside the canvas
    by default if your y-axis values are wide.

    `tight_layout()` exists for a reason.

# Voice learning. When enabled, the system fetches recent tweets from your
# own account AND from any inspiration accounts you list, then uses them as
# few-shot examples for the writer.
#
# Two flavors of signal:
#   - your_handle:     YOUR tweets, bucketed by engagement (likes/RTs/replies/
#                      views). Top-quartile become "high-performing" examples;
#                      bottom-quartile become "anti-pattern" examples. The
#                      writer learns from contrast — what works for you vs.
#                      what flops.
#   - voice_accounts:  OTHER accounts whose voice you want to imitate. Used
#                      as unlabeled style examples (no metrics — these aren't
#                      yours, so engagement isn't comparable). Just style.
#
# Requires SOCIALDATA_API_KEY in .env. Get one at https://socialdata.tools.
voice_learning:
  enabled: false
  # Your handle (with or without the @). Leave blank to skip the engagement
  # bucketing entirely and only pull voice_accounts.
  your_handle: ""
  # Accounts whose tone/structure you want to imitate. Plain handles, no @.
  voice_accounts: []
  # How many tweets to pull per handle. Higher = more signal, higher API cost.
  max_tweets_per_handle: 300
  # Below this many original tweets (after retweet/reply filter), the system
  # treats your tweets as unlabeled voice examples instead of bucketing.
  # Engagement gaps are statistical noise on tiny samples.
  min_originals_for_bucketing: 20
  # How many top + bottom tweets to surface as labeled examples.
  examples_per_bucket: 6
  # How many recent tweets per voice_account.
  examples_per_voice_account: 4
  # Re-fetch from SocialData this often. Cached corpus is reused in between
  # daily runs to keep API spend negligible.
  refresh_interval_hours: 168  # 7 days
  # Engagement scoring weights. Tune to taste.
  weights:
    likes: 1
    retweets: 3
    replies: 2
    quotes: 1
    bookmarks: 2
    views: 0.005
  # Skip tweets with fewer views than this — they're statistical noise.
  min_views_floor: 50
  # Drop replies (in_reply_to_status_id is set). They usually aren't
  # representative of your "broadcast" voice.
  exclude_replies: true

# How long the thread should be. The model can return fewer if the day is light.
thread:
  min_tweets: 2
  max_tweets: 6
  per_tweet_char_limit: 280

# Visual planner config. Set `enabled: false` to always skip visuals.
visual:
  enabled: true
  # Which formats the planner is allowed to choose from.
  # Supported: none, chart, code_snippet, illustration
  allowed_formats:
    - none
    - chart
    - code_snippet
  # Used as the title/header of generated charts.
  chart_title_prefix: "Today in code"

# What to include from your transcripts. Sensitive content can be excluded here.
transcripts:
  # Only include sessions whose cwd matches one of these substrings.
  # Leave empty to include all projects.
  include_cwd_substrings: []
  # Always exclude sessions whose cwd matches one of these substrings.
  exclude_cwd_substrings:
    - "secrets"
  # Drop tool results larger than this (chars). Tool calls themselves are kept.
  max_tool_result_chars: 800
